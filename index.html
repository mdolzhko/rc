<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт для Bluetooth-машинки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8ebef; --panel: #ffffff; --ink: #1c2230; --muted: #5d6677;
    --line: #cfd5de; --red: #d7192a; --red-ink: #ffffff; --ok: #1d8a4e; --warn: #b36b00;
    --key: #f4f6f9; --key-edge: #b9c1cc;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a22; --panel: #1f2530; --ink: #e9edf3; --muted: #9aa4b5;
      --line: #333b49; --key: #2a3140; --key-edge: #465063; --ok: #3ccf7f; --warn: #f0a33a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 20px; }
  h1 {
    font: 700 clamp(28px, 5vw, 44px)/1 "Barlow Condensed", "Arial Narrow", sans-serif;
    margin: 0; flex: 1 1 320px; letter-spacing: -0.01em;
  }
  h2 { font: 600 22px/1.2 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0 0 12px; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }
  button { font: inherit; cursor: pointer; }
  .btn {
    border: 2px solid var(--ink); background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 6px; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .pad {
    display: grid; grid-template-columns: repeat(3, minmax(72px, 110px));
    grid-template-rows: repeat(3, minmax(72px, 110px)); gap: 10px; justify-content: center; margin: 8px 0 18px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .key {
    background: var(--key); border: 2px solid var(--key-edge); border-bottom-width: 6px; border-radius: 12px;
    color: var(--ink); display: grid; place-items: center; font-size: 34px; touch-action: none;
    transition: transform .05s;
  }
  .key.pressed { background: var(--red); border-color: var(--red); color: var(--red-ink); transform: translateY(3px); border-bottom-width: 3px; }
  .key[data-k="up"] { grid-area: 1 / 2; } .key[data-k="left"] { grid-area: 2 / 1; }
  .key[data-k="right"] { grid-area: 2 / 3; } .key[data-k="down"] { grid-area: 3 / 2; }
  .center { grid-area: 2 / 2; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.3; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tog { border: 2px solid var(--key-edge); background: var(--key); color: var(--ink); border-radius: 999px; padding: 8px 16px; font-weight: 600; }
  .tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin: 14px 0 0; }
  kbd { font: 600 13px "Barlow", sans-serif; border: 1px solid var(--key-edge); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--key); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .battery { display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 10px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; max-width: 160px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .side { display: grid; gap: 16px; align-content: start; }
  .svc { font-size: 14px; margin: 0; padding-left: 18px; }
  .svc li { margin-bottom: 6px; } .svc ul { padding-left: 16px; color: var(--muted); }
  code, pre { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; }
  pre { background: var(--key); border-radius: 6px; padding: 10px; max-height: 240px; overflow: auto; margin: 0; white-space: pre-wrap; word-break: break-all; }
  select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; justify-content: center; }
  .error { color: var(--red); font-weight: 600; }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Пульт для Bluetooth-машинки</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Не підключено</span></div>
    <button class="btn" id="connectBtn">Підключити машинку</button>
    <button class="btn ghost" id="disconnectBtn" hidden>Відключити</button>
  </header>
  <p id="err" class="error" hidden></p>

  <div class="grid">
    <section class="panel" aria-label="Керування">
      <h2>Керування</h2>
      <div class="pad" id="pad">
        <button class="key" data-k="up" aria-label="Вперед">▲</button>
        <button class="key" data-k="left" aria-label="Вліво">◀</button>
        <div class="center" id="centerLabel">Утримуй, щоб їхати</div>
        <button class="key" data-k="right" aria-label="Вправо">▶</button>
        <button class="key" data-k="down" aria-label="Назад">▼</button>
      </div>
      <div class="toggles">
        <button class="tog" id="lightsBtn" aria-pressed="false">Фари</button>
        <button class="tog" id="turboBtn" aria-pressed="false">Турбо</button>
        <button class="tog" id="modeBtn" aria-pressed="false" hidden>Режим 1</button>
        <button class="tog" id="donutBtn" hidden>Донат</button>
      </div>
      <div class="row" id="legacyRow" hidden>
        <label for="layout">Формат пакета:</label>
        <select id="layout">
          <option value="A">Варіант A (перевірено на ESP32-пультах)</option>
          <option value="B">Варіант B (за описом scrool)</option>
          <option value="C">Варіант C (USB-C, зсув на 1, експериментальний)</option>
        </select>
      </div>
      <p class="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> або <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — рух, <kbd>L</kbd> — фари, <kbd>T</kbd> — турбо, пробіл — стоп</p>
    </section>

    <div class="side">
      <section class="panel" aria-label="Машинка">
        <h2>Машинка</h2>
        <dl>
          <dt>Ім'я</dt><dd id="devName">—</dd>
          <dt>Протокол</dt><dd id="protoName">—</dd>
          <dt>Заряд</dt>
          <dd><div class="battery"><div class="bar"><i id="battBar"></i></div><span id="battText">—</span></div></dd>
        </dl>
        <div class="row" style="justify-content:flex-start">
          <label class="chk"><input type="checkbox" id="showAll"> Показувати всі Bluetooth-пристрої</label>
        </div>
      </section>
      <section class="panel" aria-label="Знайдені сервіси">
        <h2>Що знайдено всередині</h2>
        <ul class="svc" id="services"><li style="list-style:none;margin-left:-18px;color:var(--muted)">Після підключення тут з'явиться список Bluetooth-сервісів машинки.</li></ul>
      </section>
      <section class="panel" aria-label="Журнал">
        <h2>Журнал</h2>
        <pre id="log"></pre>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const UUID16 = n => `0000${n.toString(16).padStart(4, '0')}-0000-1000-8000-00805f9b34fb`;

  const LEGACY_CTRL = 'd44bc439-abfd-45a2-b575-925416129600';
  const LEGACY_BATT = 'd44bc439-abfd-45a2-b575-925416129601';
  const SL_CTRL = UUID16(0xfff1), SL_TELE = UUID16(0xfff2);
  const BATT_SVC = UUID16(0x180f), BATT_LVL = UUID16(0x2a19);
  const KNOWN = {
    [UUID16(0x1800)]: 'Generic Access', [UUID16(0x1801)]: 'Generic Attribute',
    [UUID16(0x180a)]: 'Device Information', [BATT_SVC]: 'Battery', [BATT_LVL]: 'Battery Level',
    [UUID16(0xfff0)]: 'Сервіс керування (fff0)', [UUID16(0xfd00)]: 'Сервіс fd00',
    [LEGACY_CTRL]: 'Команди QCAR (шифровані)', [LEGACY_BATT]: 'Заряд QCAR (шифрований)',
    [SL_CTRL]: 'Команди SL (fff1)', [SL_TELE]: 'Телеметрія SL (fff2)',
  };
  const OPTIONAL = [0xfff0, 0xfd00, 0x180f, 0x180a, 0x1800, 0x1801];

  const KEY_BYTES = new Uint8Array('34522a5b7a6e492c08090a9d8d2a23f8'.match(/../g).map(h => parseInt(h, 16)));
  const IV = new Uint8Array(16);
  let aesKey = null;
  const getKey = async () => aesKey ??= await crypto.subtle.importKey('raw', KEY_BYTES, { name: 'AES-CBC' }, false, ['encrypt', 'decrypt']);
  async function ecbEncrypt(block) {
    const out = await crypto.subtle.encrypt({ name: 'AES-CBC', iv: IV }, await getKey(), block);
    return new Uint8Array(out).slice(0, 16);
  }
  async function ecbDecrypt(block) {
    const pad = new Uint8Array(16).fill(16).map((v, i) => v ^ block[i]);
    const tail = await ecbEncrypt(pad);
    const both = new Uint8Array(32); both.set(block); both.set(tail, 16);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: IV }, await getKey(), both));
  }

  const state = { up: false, down: false, left: false, right: false, lights: false, turbo: false, mode: 1, donut: false };
  let device = null, ctrlChar = null, proto = null, loop = null, ticking = false;
  let writing = false, pendingData = null;

  const hex = b => [...new Uint8Array(b.buffer ?? b)].map(x => x.toString(16).padStart(2, '0')).join(' ');
  function log(msg) {
    const el = $('log'); const t = new Date().toLocaleTimeString();
    el.textContent += `[${t}] ${msg}\n`;
    const lines = el.textContent.split('\n'); if (lines.length > 250) el.textContent = lines.slice(-250).join('\n');
    el.scrollTop = el.scrollHeight;
  }
  function setStatus(text, kind) { $('statusText').textContent = text; $('dot').className = 'dot' + (kind ? ' ' + kind : ''); }
  function showError(msg) { const e = $('err'); e.textContent = msg; e.hidden = !msg; }
  function setBattery(p) { $('battText').textContent = p + '%'; $('battBar').style.width = Math.max(0, Math.min(100, p)) + '%'; }

  async function write(data) {
    if (!ctrlChar) return;
    if (writing) { pendingData = data; return; }
    writing = true;
    try {
      const p = ctrlChar.properties;
      if (p.writeWithoutResponse && ctrlChar.writeValueWithoutResponse) await ctrlChar.writeValueWithoutResponse(data);
      else if (ctrlChar.writeValueWithResponse) await ctrlChar.writeValueWithResponse(data);
      else await ctrlChar.writeValue(data);
    } catch (e) { log('Помилка запису: ' + e.message); }
    writing = false;
    if (pendingData) { const d = pendingData; pendingData = null; write(d); }
  }

  function legacyPlain() {
    const p = new Uint8Array(16); p.set([0x43, 0x54, 0x4c], 1);
    const speed = state.turbo ? 0x64 : 0x50;
    const layout = $('layout').value;
    const o = layout === 'C' ? 5 : 4;
    p[o] = +state.up; p[o + 1] = +(state.down && !state.up);
    p[o + 2] = +state.left; p[o + 3] = +(state.right && !state.left);
    if (layout === 'B') p[8] = speed;
    else { p[o + 4] = +state.lights; p[o + 5] = speed; }
    return p;
  }
  async function legacyTick() {
    if (ticking || writing || proto !== 'legacy') return;
    ticking = true;
    try { await write(await ecbEncrypt(legacyPlain())); } finally { ticking = false; }
  }
  function slPayload() {
    return new Uint8Array([state.mode, +state.up, +state.down, +state.left, +state.right, +state.lights, +state.turbo, +state.donut]);
  }
  function onStateChange() {
    if (proto === 'sl') write(slPayload());
  }

  function setKey(k, v) {
    if (state[k] === v) return;
    state[k] = v;
    document.querySelector(`.key[data-k="${k}"]`)?.classList.toggle('pressed', v);
    onStateChange();
  }
  function releaseAll() { ['up', 'down', 'left', 'right'].forEach(k => setKey(k, false)); if (state.donut) { state.donut = false; onStateChange(); } }
  function toggle(name, btn) {
    state[name] = !state[name]; btn.setAttribute('aria-pressed', String(state[name])); onStateChange();
  }

  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.dataset.k;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); setKey(k, true); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, () => setKey(k, false)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
  $('lightsBtn').onclick = e => toggle('lights', e.currentTarget);
  $('turboBtn').onclick = e => toggle('turbo', e.currentTarget);
  $('modeBtn').onclick = e => {
    state.mode = state.mode === 1 ? 2 : 1; e.currentTarget.textContent = 'Режим ' + state.mode;
    e.currentTarget.setAttribute('aria-pressed', String(state.mode === 2)); onStateChange();
  };
  const donut = $('donutBtn');
  donut.addEventListener('pointerdown', () => { state.donut = true; onStateChange(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => donut.addEventListener(ev, () => { if (state.donut) { state.donut = false; onStateChange(); } }));

  const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (KEYMAP[e.code]) { e.preventDefault(); setKey(KEYMAP[e.code], true); }
    else if (e.repeat) return;
    else if (e.code === 'KeyL') toggle('lights', $('lightsBtn'));
    else if (e.code === 'KeyT') toggle('turbo', $('turboBtn'));
    else if (e.code === 'Space') { e.preventDefault(); releaseAll(); }
  });
  window.addEventListener('keyup', e => { if (KEYMAP[e.code]) setKey(KEYMAP[e.code], false); });
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  async function connect() {
    showError('');
    if (!navigator.bluetooth) {
      showError('Цей браузер не підтримує Web Bluetooth. Відкрий сторінку в Chrome або Edge через http://localhost.');
      return;
    }
    try {
      const opts = $('showAll').checked
        ? { acceptAllDevices: true, optionalServices: OPTIONAL }
        : { filters: [{ namePrefix: 'QCAR' }, { namePrefix: 'SL-' }], optionalServices: OPTIONAL };
      device = await navigator.bluetooth.requestDevice(opts);
    } catch (e) {
      if (e.name !== 'NotFoundError') showError(e.message);
      else log('Вибір скасовано або машинку не знайдено.');
      return;
    }
    $('devName').textContent = device.name || '(без імені)';
    log('Обрано: ' + (device.name || device.id));
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('Підключаюсь…', 'busy');
    try {
      const server = await device.gatt.connect();
      await discover(server);
    } catch (e) {
      showError('Не вдалося підключитись: ' + e.message);
      setStatus('Не підключено');
      return;
    }
    $('connectBtn').hidden = true; $('disconnectBtn').hidden = false;
  }

  async function discover(server) {
    const list = $('services'); list.innerHTML = '';
    const chars = {};
    let services = [];
    try { services = await server.getPrimaryServices(); } catch (e) { log('Сервіси недоступні: ' + e.message); }
    for (const s of services) {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${KNOWN[s.uuid] || 'Невідомий сервіс'}</strong><br><code>${s.uuid}</code>`;
      const ul = document.createElement('ul');
      try {
        for (const c of await s.getCharacteristics()) {
          chars[c.uuid] = c;
          const props = Object.entries({ read: 'READ', write: 'WRITE', writeWithoutResponse: 'WRITE_NR', notify: 'NOTIFY', indicate: 'INDICATE' })
            .filter(([k]) => c.properties[k]).map(([, v]) => v).join(', ');
          const item = document.createElement('li');
          item.innerHTML = `${KNOWN[c.uuid] ? KNOWN[c.uuid] + ' · ' : ''}<code>${c.uuid}</code> [${props}]`;
          ul.appendChild(item);
        }
      } catch (e) { ul.innerHTML = `<li>${e.message}</li>`; }
      li.appendChild(ul); list.appendChild(li);
      log('Сервіс ' + s.uuid);
    }

    if (chars[LEGACY_CTRL]) {
      proto = 'legacy'; ctrlChar = chars[LEGACY_CTRL];
      $('protoName').textContent = 'Brandbase QCAR (AES, 2019–2020)';
      $('legacyRow').hidden = false;
      $('centerLabel').textContent = 'QCAR';
      loop = setInterval(legacyTick, 20);
      if (chars[LEGACY_BATT]) {
        try {
          const b = chars[LEGACY_BATT];
          b.addEventListener('characteristicvaluechanged', async ev => {
            const raw = new Uint8Array(ev.target.value.buffer);
            if (raw.length !== 16) return log('Заряд (сирі дані): ' + hex(raw));
            const p = await ecbDecrypt(raw);
            if (String.fromCharCode(p[1], p[2], p[3]) === 'VBT') { setBattery(p[4]); log('Заряд: ' + p[4] + '%'); }
            else log('Сповіщення: ' + hex(p));
          });
          await b.startNotifications();
          log('Підписався на заряд (оновлюється раз на хвилину).');
        } catch (e) { log('Заряд недоступний: ' + e.message); }
      }
      setStatus('Підключено: QCAR', 'on');
    } else if (chars[SL_CTRL]) {
      proto = 'sl'; ctrlChar = chars[SL_CTRL];
      $('protoName').textContent = 'Shell Racing Legends (2024+)';
      $('modeBtn').hidden = false; $('donutBtn').hidden = false;
      $('centerLabel').textContent = 'SL';
      if (chars[BATT_LVL]) {
        const b = chars[BATT_LVL];
        try { setBattery((await b.readValue()).getUint8(0)); } catch (e) { log('Не прочитав заряд: ' + e.message); }
        try {
          b.addEventListener('characteristicvaluechanged', ev => setBattery(ev.target.value.getUint8(0)));
          await b.startNotifications();
        } catch { }
      }
      if (chars[SL_TELE]) {
        let last = '';
        try {
          chars[SL_TELE].addEventListener('characteristicvaluechanged', ev => {
            const h = hex(new Uint8Array(ev.target.value.buffer)); if (h !== last) { last = h; log('Телеметрія: ' + h); }
          });
          await chars[SL_TELE].startNotifications();
        } catch { }
      }
      write(slPayload());
      setStatus('Підключено: SL', 'on');
    } else {
      proto = null; ctrlChar = null;
      $('protoName').textContent = 'Невідомий';
      setStatus('Підключено, протокол невідомий', 'busy');
      showError('Протокол цієї машинки поки невідомий. Зроби скріншот блоку «Що знайдено всередині» — розберемося, які байти їй надсилати.');
    }
  }

  function onDisconnected() {
    clearInterval(loop); loop = null; ctrlChar = null; proto = null; writing = false; pendingData = null;
    releaseAll();
    setStatus('Не підключено'); log('Машинка відключилась.');
    $('connectBtn').hidden = false; $('disconnectBtn').hidden = true;
    $('legacyRow').hidden = true; $('modeBtn').hidden = true; $('donutBtn').hidden = true;
    $('centerLabel').textContent = 'Утримуй, щоб їхати';
  }

  $('connectBtn').onclick = connect;
  $('disconnectBtn').onclick = () => { releaseAll(); setTimeout(() => device?.gatt?.disconnect(), 60); };

  if (!navigator.bluetooth) {
    showError('Web Bluetooth недоступний. Потрібен Chrome або Edge, а сторінку треба відкрити через http://localhost або https://.');
  }
})();
</script>
</body>
</html>
